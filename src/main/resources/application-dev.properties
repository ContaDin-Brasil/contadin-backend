# ===============================
# APPLICATION
# ===============================
spring.application.name=contadin

# ===============================
# DATASOURCE - POSTGRESQL (DEV)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_URL}/railway
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# POOL DE CONEXOES (HikariCP - default do Spring)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Formatacao do SQL no log
spring.jpa.properties.hibernate.format_sql=true
# Timezone padrao (boa pratica)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# SYSADMIN (dev: defaults; prod: use env SYSADMIN_EMAIL, SYSADMIN_SENHA)
# ===============================
app.sysadmin.email=${SYSADMIN_EMAIL:sysadmin@contadin.com}
app.sysadmin.senha=${SYSADMIN_SENHA:sysadmin}

# ===============================
# JWT - Tempo de expiracao padrao (1 hora)
# ===============================
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# MOCK ENTITIES DATABASE
# ===============================
app.set.mockdata=true

# ===============================
# MAIL (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:contadinbrasil01@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vigp ykpq rgzb yssz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:contadinbrasil01@gmail.com}

# ===============================
# LOGGING (SQL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Mudar path do Swagger UI
springdoc.swagger-ui.path=/api-contadin
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# (opcional) mudar path da API JSON
springdoc.api-docs.path=/api-contadin-json
