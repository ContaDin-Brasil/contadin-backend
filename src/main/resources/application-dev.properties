# ==================================================
# APPLICATION
# ==================================================
spring.application.name=contadin

# ==================================================
# DATASOURCE - SQL SERVER (DEV)
# ==================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contadin;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:contadin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool de conexões (HikariCP - default do Spring)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Formatação do SQL no log
spring.jpa.properties.hibernate.format_sql=true

# Timezone padrão (boa prática)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==================================================
# LOGGING (SQL)
# ==================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE