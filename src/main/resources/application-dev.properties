# ===============================
# APPLICATION
# ===============================
spring.application.name=contadin

# ===============================
# DATASOURCE - SQL SERVER (DEV)
# ===============================
spring.datasource.url=jdbc:sqlserver://${DB_URL:localhost:1433};databaseName=contadin;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:contadin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# POOL DE CONEXOES (HikariCP - default do Spring)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Formatacao do SQL no log
spring.jpa.properties.hibernate.format_sql=true
# Timezone padrao (boa pratica)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# SYSADMIN (dev: defaults; prod: use env SYSADMIN_EMAIL, SYSADMIN_SENHA)
# ===============================
app.sysadmin.email=${SYSADMIN_EMAIL:sysadmin@contadin.com}
app.sysadmin.senha=${SYSADMIN_SENHA:sysadmin}

# ===============================
# JWT - Tempo de expiracao padrao (1 hora)
# ===============================
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# MOCK ENTITIES DATABASE
# ===============================
app.set.mockdata=true

# ===============================
# LOGGING (SQL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# SWAGGER UI
# ===============================
springdoc.swagger-ui.path=/api-contadin
springdoc.swagger-ui.persist-authorization=false
