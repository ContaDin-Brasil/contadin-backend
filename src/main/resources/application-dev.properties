spring.application.name=contadin

# ===============================
# DATASOURCE - SQL SERVER (DEV)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contadin;encrypt=true;trustServerCertificate=true
spring.datasource.username=${USUARIO:contadin}
spring.datasource.password=${SENHA}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true