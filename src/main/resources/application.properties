# ===============================
# APPLICATION
# ===============================
spring.application.name=contadin

# ===============================
# DATASOURCE - H2 (IN-MEMORY)
# ===============================
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# SYSADMIN (dev: defaults; prod: use env SYSADMIN_EMAIL, SYSADMIN_SENHA)
# ===============================
app.sysadmin.email=${SYSADMIN_EMAIL:sysadmin@contadin.com}
app.sysadmin.senha=${SYSADMIN_SENHA:sysadmin}

# ===============================
# MOCK ENTITIES DATABASE
# ===============================
app.set.mockdata=true

# Mudar path do Swagger UI
springdoc.swagger-ui.path=/api-contadin

# (opcional) mudar path da API JSON
springdoc.api-docs.path=/api-contadin-json
