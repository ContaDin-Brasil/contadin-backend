# ===============================
# APPLICATION
# ===============================
spring.application.name=contadin

# ===============================
# DATASOURCE - H2 (IN-MEMORY)
# ===============================
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# CORS
# Em produção, defina CORS_ALLOWED_ORIGINS com as origens separadas por vírgula
# Ex: CORS_ALLOWED_ORIGINS=https://contadin-frontend-production.up.railway.app
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://contadin-frontend-production.up.railway.app,http://localhost:8081}

# ===============================
# SYSADMIN (dev: defaults; prod: use env SYSADMIN_EMAIL, SYSADMIN_SENHA)
# ===============================
app.sysadmin.email=${SYSADMIN_EMAIL:sysadmin@contadin.com}
app.sysadmin.senha=${SYSADMIN_SENHA:sysadmin}

# ===============================
# JWT - Tempo de expiracao padrao (1 hora)
# ===============================
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:360000000}

# ===============================
# MOCK ENTITIES DATABASE
# ===============================
app.set.mockdata=true

# ===============================
# MAIL (SMTP)
# Configure via variáveis de ambiente em produção:
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:contadinbrasil01@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vigp ykpq rgzb yssz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:contadinbrasil01@gmail.com}

# Mudar path do Swagger UI
springdoc.swagger-ui.path=/api-contadin
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# (opcional) mudar path da API JSON
springdoc.api-docs.path=/api-contadin-json
